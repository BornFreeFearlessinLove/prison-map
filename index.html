<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国戒网瘾学校动态地图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #0a0e27;
            color: #e0e6f0;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            padding: 20px 20px 10px;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 100%);
            border-bottom: 1px solid rgba(100, 140, 255, 0.2);
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 13px;
            color: #8892b0;
        }
        .toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(15, 20, 50, 0.9);
            border-bottom: 1px solid rgba(100, 140, 255, 0.15);
            flex-wrap: wrap;
        }
        .toolbar button {
            padding: 8px 16px;
            border: 1px solid rgba(100, 140, 255, 0.3);
            border-radius: 6px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .toolbar button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.3);
        }
        .toolbar button.btn-warn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .toolbar button.btn-warn:hover {
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .toolbar button.btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .toolbar button.btn-danger:hover {
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 12px 20px;
            background: rgba(20, 25, 60, 0.8);
            border-bottom: 1px solid rgba(100, 140, 255, 0.1);
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .num {
            font-size: 22px;
            font-weight: bold;
            color: #60a5fa;
        }
        .stat-item .label {
            font-size: 11px;
            color: #8892b0;
        }
        .legend-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 8px 20px;
            background: rgba(20, 25, 60, 0.5);
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #a0aec0;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        #chart-container {
            width: 100%;
            height: 680px;
            position: relative;
        }
        .timeline-section {
            padding: 15px 30px;
            background: rgba(20, 25, 60, 0.6);
            border-top: 1px solid rgba(100, 140, 255, 0.15);
        }
        .timeline-title {
            font-size: 16px;
            color: #60a5fa;
            margin-bottom: 12px;
            text-align: center;
        }
        .timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .timeline-item {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid rgba(100, 140, 255, 0.3);
            background: rgba(30, 40, 80, 0.6);
            color: #a0aec0;
            transition: all 0.3s;
        }
        .timeline-item:hover, .timeline-item.active {
            background: rgba(96, 165, 250, 0.3);
            border-color: #60a5fa;
            color: #fff;
        }
        .timeline-item.event-critical {
            border-color: rgba(248, 113, 113, 0.5);
        }
        .timeline-item.event-critical:hover, .timeline-item.event-critical.active {
            background: rgba(248, 113, 113, 0.2);
            border-color: #f87171;
        }
        .timeline-item.event-policy {
            border-color: rgba(52, 211, 153, 0.5);
        }
        .timeline-item.event-policy:hover, .timeline-item.event-policy.active {
            background: rgba(52, 211, 153, 0.2);
            border-color: #34d399;
        }
        .info-panel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 420px;
            height: 100vh;
            background: linear-gradient(180deg, #111638 0%, #0a0e27 100%);
            border-left: 1px solid rgba(100, 140, 255, 0.2);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
        }
        .info-panel.open {
            right: 0;
        }
        .info-panel-header {
            padding: 20px;
            border-bottom: 1px solid rgba(100, 140, 255, 0.15);
            position: sticky;
            top: 0;
            background: #111638;
            z-index: 1;
        }
        .info-panel-header h2 {
            font-size: 18px;
            color: #e0e6f0;
            margin-bottom: 8px;
        }
        .info-panel-header .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-closed {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .status-open {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
        .status-unknown {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border: 1px solid rgba(100, 140, 255, 0.3);
            border-radius: 50%;
            background: transparent;
            color: #a0aec0;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: #f87171;
            color: #f87171;
        }
        .info-content {
            padding: 20px;
        }
        .info-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid rgba(100, 140, 255, 0.08);
        }
        .info-row .label {
            width: 90px;
            flex-shrink: 0;
            font-size: 13px;
            color: #8892b0;
        }
        .info-row .value {
            flex: 1;
            font-size: 13px;
            color: #e0e6f0;
            word-break: break-all;
        }
        .info-row .value a {
            color: #60a5fa;
            text-decoration: none;
        }
        .info-row .value a:hover {
            text-decoration: underline;
        }
        .info-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(100, 140, 255, 0.15);
        }
        .info-actions button {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(100, 140, 255, 0.3);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: #fff;
        }
        .btn-edit {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
        }
        .btn-edit:hover {
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.3);
        }
        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .btn-delete:hover {
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        .tianyancha-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .tianyancha-btn:hover {
            transform: scale(1.05);
        }
        .event-section {
            margin-top: 15px;
            padding: 15px;
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.15);
            border-radius: 8px;
        }
        .event-section h3 {
            font-size: 14px;
            color: #f87171;
            margin-bottom: 8px;
        }
        .event-section p {
            font-size: 12px;
            color: #a0aec0;
            line-height: 1.8;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .overlay.show {
            display: block;
        }
        /* ===== Form Panel (left slide) ===== */
        .form-panel {
            position: fixed;
            top: 0;
            left: -500px;
            width: 480px;
            height: 100vh;
            background: linear-gradient(180deg, #111638 0%, #0a0e27 100%);
            border-right: 1px solid rgba(100, 140, 255, 0.2);
            z-index: 1001;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.5);
        }
        .form-panel.open {
            left: 0;
        }
        .form-panel-header {
            padding: 20px;
            border-bottom: 1px solid rgba(100, 140, 255, 0.15);
            position: sticky;
            top: 0;
            background: #111638;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-panel-header h2 {
            font-size: 18px;
            color: #e0e6f0;
        }
        .form-body {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 6px;
        }
        .form-group label .required {
            color: #f87171;
            margin-left: 2px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: #1a1f3e;
            border: 1px solid rgba(100, 140, 255, 0.3);
            border-radius: 6px;
            color: #e0e6f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #60a5fa;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-group select {
            cursor: pointer;
        }
        .form-group select option {
            background: #1a1f3e;
            color: #e0e6f0;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #e0e6f0;
        }
        .form-group .checkbox-label input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }
        .btn-estimate {
            display: inline-block;
            margin-top: 6px;
            padding: 6px 14px;
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(100, 140, 255, 0.3);
            border-radius: 4px;
            color: #60a5fa;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-estimate:hover {
            background: rgba(96, 165, 250, 0.25);
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(100, 140, 255, 0.15);
        }
        .form-actions button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: #fff;
        }
        .btn-submit {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
        }
        .btn-submit:hover {
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.4);
        }
        .btn-cancel {
            background: rgba(100, 100, 120, 0.3);
            border: 1px solid rgba(100, 140, 255, 0.2);
        }
        .btn-cancel:hover {
            background: rgba(100, 100, 120, 0.5);
        }
        /* ===== Delete Confirm Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: linear-gradient(180deg, #1a1040 0%, #0f0a20 100%);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 30px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(239, 68, 68, 0.2);
        }
        .modal-box h3 {
            font-size: 18px;
            color: #f87171;
            margin-bottom: 12px;
        }
        .modal-box p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .modal-box p strong {
            color: #e0e6f0;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: #fff;
        }
        .modal-btn-cancel {
            background: rgba(100, 100, 120, 0.3);
            border: 1px solid rgba(100, 140, 255, 0.2);
        }
        .modal-btn-cancel:hover {
            background: rgba(100, 100, 120, 0.5);
        }
        .modal-btn-confirm-delete {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        .modal-btn-confirm-delete:hover {
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            background: linear-gradient(135deg, #1a1f4e, #111638);
            border: 1px solid rgba(100, 140, 255, 0.3);
            border-radius: 8px;
            color: #e0e6f0;
            font-size: 14px;
            z-index: 3000;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: rgba(52, 211, 153, 0.4);
        }
        .toast.error {
            border-color: rgba(239, 68, 68, 0.4);
        }
        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #4a5568;
            border-top: 1px solid rgba(100, 140, 255, 0.1);
        }
        #importFileInput {
            display: none;
        }
        @media (max-width: 768px) {
            .info-panel { width: 100%; right: -100%; }
            .form-panel { width: 100%; left: -100%; }
            #chart-container { height: 500px; }
            .header h1 { font-size: 20px; }
            .stats-bar { gap: 15px; }
            .toolbar { gap: 6px; padding: 8px 10px; }
            .toolbar button { padding: 6px 10px; font-size: 12px; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>中国戒网瘾学校动态地图</h1>
        <p>记录从1990年代至今国内网瘾戒治机构/特训学校/行为矫正学校的分布与变迁</p>
    </div>

    <div class="toolbar">
        <button onclick="openAddForm()">+ 添加学校</button>
        <button class="btn-warn" onclick="restoreDefaults()">恢复默认数据</button>
        <button onclick="exportData()">导出数据</button>
        <button onclick="document.getElementById('importFileInput').click()">导入数据</button>
        <input type="file" id="importFileInput" accept=".json" onchange="importData(event)">
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="num" id="total-count">0</div>
            <div class="label">收录机构总数</div>
        </div>
        <div class="stat-item">
            <div class="num" id="closed-count">0</div>
            <div class="label">已关停/取缔</div>
        </div>
        <div class="stat-item">
            <div class="num" id="open-count">0</div>
            <div class="label">仍在运营</div>
        </div>
        <div class="stat-item">
            <div class="num" id="province-count">0</div>
            <div class="label">覆盖省份</div>
        </div>
    </div>

    <div class="legend-bar">
        <div class="legend-item"><div class="legend-dot" style="background:#34d399;"></div> 仍在运营</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f87171;"></div> 已关停/取缔</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fbbf24;"></div> 状态不明</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f472b6; width:14px; height:14px;"></div> 重大事件</div>
    </div>

    <div id="chart-container"></div>

    <div class="timeline-section">
        <div class="timeline-title">重要事件时间线（点击可筛选地图上的学校）</div>
        <div class="timeline" id="timeline"></div>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- Info Panel (right side) -->
    <div class="info-panel" id="infoPanel">
        <div class="info-panel-header">
            <button class="close-btn" id="closeBtn">x</button>
            <h2 id="panelTitle">学校名称</h2>
            <span class="status-badge" id="panelStatus"></span>
        </div>
        <div class="info-content" id="panelContent"></div>
    </div>

    <!-- Form Panel (left side) -->
    <div class="form-panel" id="formPanel">
        <div class="form-panel-header">
            <h2 id="formTitle">添加学校</h2>
            <button class="close-btn" id="formCloseBtn">x</button>
        </div>
        <div class="form-body">
            <div class="form-group">
                <label>名称 <span class="required">*</span></label>
                <input type="text" id="f_name" placeholder="学校简称">
            </div>
            <div class="form-group">
                <label>所在省份 <span class="required">*</span></label>
                <select id="f_province"></select>
            </div>
            <div class="form-group">
                <label>所在市区</label>
                <input type="text" id="f_city" placeholder="如：郑州市">
            </div>
            <div class="form-group">
                <label>所在旗县</label>
                <input type="text" id="f_county" placeholder="如：中牟县">
            </div>
            <div class="form-group">
                <label>详细地址</label>
                <input type="text" id="f_address" placeholder="详细地址">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>成立年份</label>
                    <input type="number" id="f_year" placeholder="如：2010" min="1990" max="2030">
                </div>
                <div class="form-group">
                    <label>法人/负责人</label>
                    <input type="text" id="f_legalPerson" placeholder="法人或负责人姓名">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>注册资本</label>
                    <input type="text" id="f_registeredCapital" placeholder="如：100万元">
                </div>
                <div class="form-group">
                    <label>学费金额</label>
                    <input type="text" id="f_tuition" placeholder="如：48800元/期">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>师生数量</label>
                    <input type="text" id="f_students" placeholder="如：约500人">
                </div>
                <div class="form-group">
                    <label>运营状态</label>
                    <select id="f_status">
                        <option value="open">运营中</option>
                        <option value="closed">已关停</option>
                        <option value="unknown">状态不明</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>统一社会信用代码</label>
                <input type="text" id="f_creditCode" placeholder="18位信用代码">
            </div>
            <div class="form-group">
                <label>天眼查搜索关键词</label>
                <input type="text" id="f_tianyanchaKeyword" placeholder="企业名称关键词">
            </div>
            <div class="form-group">
                <label>重大事件</label>
                <textarea id="f_event" placeholder="描述重大事件经过..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>事件发生年份</label>

        document.getElementById('open-count').textContent = open;
        document.getElementById('province-count').textContent = provCount;

    // ==================== 经纬度自动估算 ====================
    function estimateCoords() {
        var province = document.getElementById('f_province').value;
        var city = document.getElementById('f_city').value;
        var county = document.getElementById('f_county').value;

        // 尝试匹配城市
        var coords = null;

        // 先尝试匹配完整城市名
        if (city) {
            // 去掉"市"后缀再试
            var cityNames = [city];
            if (city.indexOf('市') > -1) {
                cityNames.push(city.substring(0, city.indexOf('市')));
            }
            // 也尝试带省份前缀
            cityNames.push(province + city);

            for (var i = 0; i < cityNames.length; i++) {
                if (cityCoords[cityNames[i]]) {
                    coords = cityCoords[cityNames[i]];
                    break;
                }
            }
        }

        // 如果城市没匹配到，使用省份省会
        if (!coords && province && provinceCapitalCoords[province]) {
            coords = provinceCapitalCoords[province];
        }

        if (coords) {
            document.getElementById('f_lng').value = coords[0];
            document.getElementById('f_lat').value = coords[1];
            showToast('经纬度已估算填充', 'success');
        } else {
            showToast('无法估算，请手动输入经纬度', 'error');
        }
    }

    function submitForm() {
        var name = document.getElementById('f_name').value.trim();

        if (!name) {
            showToast('请填写学校名称', 'error');

        if (!province) {
            showToast('请选择所在省份', 'error');

        var statusVal = document.getElementById('f_status').value;
        var statusTextMap = { open: '正常运营', closed: '已关停', unknown: '状态不明' };

            closeInfoPanel();
            closeDeleteModal();
            showToast('已删除「' + name + '」', 'success');
        }
    }

    // ==================== 恢复默认数据 ====================
    function restoreDefaults() {
        schools = JSON.parse(JSON.stringify(defaultSchools));
        saveSchools();
        updateStats();
        refreshChart();
        showToast('已恢复为默认数据', 'success');
    }

    // ==================== 导出数据 ====================
    function exportData() {
        var json = JSON.stringify(schools, null, 2);
        var blob = new Blob([json], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '戒网瘾学校数据_' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('数据已导出', 'success');
    }

    // ==================== 导入数据 ====================
    function importData(event) {
        var file = event.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var imported = JSON.parse(e.target.result);
                if (!Array.isArray(imported)) {
                    showToast('JSON格式错误：需要一个数组', 'error');
                    return;
                }
                // 合并数据：以name为key去重，导入的数据覆盖已有数据
                var existMap = {};
                schools.forEach(function(s, i) { existMap[s.name] = i; });

                var addedCount = 0;
                var updatedCount = 0;
                imported.forEach(function(item) {
                    if (item.name && existMap[item.name] !== undefined) {
                        schools[existMap[item.name]] = item;
                        updatedCount++;
                    } else if (item.name) {
                        schools.push(item);
                        addedCount++;
                    }
                });

                saveSchools();
                updateStats();
                refreshChart();
                showToast('导入完成：新增' + addedCount + '条，更新' + updatedCount + '条', 'success');
            } catch (err) {
                showToast('JSON解析失败：' + err.message, 'error');
            }
        };
        reader.readAsText(file);
        // 重置input，允许再次选择同一文件
        event.target.value = '';
    }

    // ==================== 初始化 ====================
    loadSchools();
    initProvinceSelect();

    var chartDom = document.getElementById('chart-container');
    myChart = echarts.init(chartDom, 'dark');

    updateStats();

    // ==================== 时间线渲染 ====================
    var timelineContainer = document.getElementById('timeline');

    function renderTimeline() {
        timelineContainer.innerHTML = '';
        timelineEvents.forEach(function(evt) {
            var div = document.createElement('div');
            var cls = 'timeline-item';
            if (evt.type === 'critical') cls += ' event-critical';
            if (evt.type === 'policy') cls += ' event-policy';
            div.className = cls;
            div.textContent = evt.year + ' ' + evt.text;
            div.dataset.year = evt.year;
            div.addEventListener('click', function() {
                if (activeYear === evt.year) {
                    activeYear = null;
                    document.querySelectorAll('.timeline-item').forEach(function(el) { el.classList.remove('active'); });
                    updateChart(null);
                } else {
                    activeYear = evt.year;
                    document.querySelectorAll('.timeline-item').forEach(function(el) { el.classList.remove('active'); });
                    div.classList.add('active');
                    updateChart(evt.year);
                }
            });
            timelineContainer.appendChild(div);
        });
    }
    renderTimeline();

    // ==================== 地图配置 ====================
    function getSeriesData(filterYear) {
        return schools.map(function(s) {
            var show = true;
            if (filterYear !== null) {
                show = (s.year === filterYear || s.eventYear === filterYear);
            }
            var colorMap = {
                closed: '#f87171',
                open: '#34d399',
                unknown: '#fbbf24'
            };
            return {
                name: s.name,
                value: [s.lng, s.lat, s.year],
                itemStyle: {
                    color: show ? colorMap[s.status] : 'rgba(100,100,100,0.3)',
                    shadowBlur: show ? (s.majorEvent ? 15 : 8) : 0,
                    shadowColor: show ? (s.majorEvent ? 'rgba(244,114,182,0.6)' : colorMap[s.status] + '80') : 'transparent'
                },
                symbolSize: show ? (s.majorEvent ? 16 : 10) : 6,
                label: {
                    show: show && s.majorEvent,
                    formatter: s.name.length > 8 ? s.name.substring(0, 8) + '...' : s.name,
                    fontSize: 10,
                    color: '#f472b6'
                },
                schoolData: s,
                visible: show
            };
        });
    }

    function getOption(filterYear) {
        var seriesData = getSeriesData(filterYear);

        return {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(15, 20, 50, 0.95)',
                borderColor: 'rgba(100, 140, 255, 0.3)',
                borderWidth: 1,
                padding: [10, 14],
                textStyle: { color: '#e0e6f0', fontSize: 13 },
                formatter: function(params) {
                    var s = params.data.schoolData;
                    if (!s) return params.name;
                    var statusLabel = { closed: '已关停', open: '运营中', unknown: '状态不明' };
                    return '<div style="font-weight:bold;font-size:14px;margin-bottom:6px;">' + s.name + '</div>' +
                        '<div style="font-size:12px;color:#8892b0;">' + s.province + ' · ' + s.city + '</div>' +
                        '<div style="margin-top:6px;">' + statusLabel[s.status] + ' | 成立于 ' + s.year + '年</div>' +
                        '<div style="margin-top:4px;font-size:11px;color:#60a5fa;">点击查看详情</div>';
                }
            },
            geo: {
                map: 'china',
                roam: true,
                zoom: 1.2,
                center: [104.5, 36],
                scaleLimit: { min: 1, max: 8 },
                label: {
                    show: true,
                    fontSize: 9,
                    color: 'rgba(160, 174, 192, 0.6)'
                },
                emphasis: {
                    label: {
                        show: true,
                        fontSize: 11,
                        color: '#e0e6f0'
                    },
                    itemStyle: {
                        areaColor: 'rgba(96, 165, 250, 0.15)',
                        borderColor: '#60a5fa'
                    }
                },
                itemStyle: {
                    areaColor: 'rgba(20, 30, 70, 0.8)',
                    borderColor: 'rgba(100, 140, 255, 0.25)',
                    borderWidth: 0.8
                }
            },
            series: [{
                type: 'scatter',
                coordinateSystem: 'geo',
                data: seriesData,
                encode: { value: 2 },
                animation: true,
                animationDuration: 800,
                animationEasing: 'cubicOut'
            }]
        };
    }

    function updateChart(filterYear) {
        if (myChart && mapLoaded) {
            myChart.setOption(getOption(filterYear));
        }
    }

    function refreshChart() {
        if (myChart && mapLoaded) {
            myChart.setOption(getOption(activeYear));
        }
    }

    // 加载地图
    fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
        .then(function(res) { return res.json(); })
        .then(function(geoJson) {
            echarts.registerMap('china', geoJson);
            mapLoaded = true;
            myChart.setOption(getOption(null));

            myChart.on('click', function(params) {
                if (params.data && params.data.schoolData) {
                    // 找到该学校在当前数组中的索引
                    var idx = schools.findIndex(function(s) { return s.name === params.data.schoolData.name; });
                    if (idx >= 0) {
                        showInfoPanel(idx);
                    }
                }
            });
        })
        .catch(function(err) {
            console.error('地图数据加载失败:', err);
            document.getElementById('chart-container').innerHTML =
                '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#f87171;font-size:16px;">地图数据加载失败，请检查网络连接后刷新页面</div>';
        });

    window.addEventListener('resize', function() { if (myChart) myChart.resize(); });

    // ==================== 信息面板 ====================
    var infoPanel = document.getElementById('infoPanel');
    var overlay = document.getElementById('overlay');

    function showInfoPanel(index) {
        var school = schools[index];
        document.getElementById('panelTitle').textContent = school.name;

        var statusEl = document.getElementById('panelStatus');
        statusEl.textContent = school.statusText;
        var statusClass = 'status-badge ';
        if (school.status === 'closed') statusClass += 'status-closed';
        else if (school.status === 'open') statusClass += 'status-open';
        else statusClass += 'status-unknown';
        statusEl.className = statusClass;

        var html = '';
        var rows = [
            ['全称', school.fullName],
            ['省份/城市', school.province + ' · ' + school.city],
            ['地址', school.address],
            ['成立年份', school.year ? school.year + '年' : '未公开'],
            ['法人/负责人', school.legalPerson],
            ['注册资本', school.registeredCapital],
            ['学费', school.tuition],
            ['师生人数', school.students],
            ['信用代码', school.creditCode || '未公开']
        ];

        rows.forEach(function(row) {
            html += '<div class="info-row"><div class="label">' + row[0] + '</div><div class="value">' + (row[1] || '未公开') + '</div></div>';
        });

        // 天眼查链接
        if (school.tianyanchaKeyword) {
            var searchUrl = 'https://www.tianyancha.com/search?key=' + encodeURIComponent(school.tianyanchaKeyword);
            html += '<a class="tianyancha-btn" href="' + searchUrl + '" target="_blank" rel="noopener noreferrer">天眼查查询：' + school.tianyanchaKeyword + '</a>';
        }

        // 事件信息
        if (school.event) {
            html += '<div class="event-section"><h3>重要事件</h3><p>' + school.event + '</p></div>';
        }

        // 编辑/删除按钮
        html += '<div class="info-actions">';
        html += '<button class="btn-edit" onclick="openEditForm(' + index + ')">编辑信息</button>';
        html += '<button class="btn-delete" onclick="openDeleteModal(' + index + ')">删除</button>';
        html += '</div>';

        document.getElementById('panelContent').innerHTML = html;
        infoPanel.classList.add('open');
        overlay.classList.add('show');
    }

    function closeInfoPanel() {
        infoPanel.classList.remove('open');
        overlay.classList.remove('show');
    }

    document.getElementById('closeBtn').addEventListener('click', closeInfoPanel);
    document.getElementById('formCloseBtn').addEventListener('click', closeFormPanel);
    overlay.addEventListener('click', function() {
        closeInfoPanel();
        closeFormPanel();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeInfoPanel();
            closeFormPanel();
            closeDeleteModal();
        }
    });
    </script>
</body>
</html>
